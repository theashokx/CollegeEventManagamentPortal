<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVR Events Management Portal</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .hero {
        min-height: 100vh;
        background: url("Images/backgroundImage.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .nav-link:hover {
        color: #ffc107 !important;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img
            src="Images/EventLogo.png"
            alt="Logo"
            width="60"
            height="60"
            class="rounded-circle border border-2 border-light"
          />

          <div class="ms-3">
            <h4 class="mb-0 fw-bold">CVR Events</h4>
            <small class="text-light"> Management Portal </small>
          </div>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link active text-warning" href="#"> Home </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Events </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Gallery </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Registration </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#"> Contact </a>
            </li>

            <li class="nav-item ms-lg-3">
              <a class="btn btn-warning px-4 fw-semibold" href="#">
                Register
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="hero d-flex align-items-center text-center text-white">
      <div class="container">
        <div class="mt-5">
          <a href="#" class="btn btn-primary btn-lg px-5 me-3">
            Register Now
          </a>

          <a href="#" class="btn btn-outline-light btn-lg px-5">
            Explore Events
          </a>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
